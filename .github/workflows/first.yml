name: first workflow
on:
  push:
  pull_request:

jobs:
  first_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: install dependencies
        run: npm ci

      - name: test eslint
        run: npm run lint

      - name: make react build
        run: npm run build
