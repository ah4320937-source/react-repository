name: first workflow

on:
  push:
  pull_request:

jobs:
  first_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test oxlint
        run: npm run lint

      - name: Test case
        run: npm run test

      - name: Make React build
        run: npm run build

      - name: Create artifacts
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: dist/
          retention-days: 7
